name: Deploy Supabase Functions

on:
    push:
        branches:
            - main # Oder dein Standard-Branch

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'

            - name: Deploy Supabase Function
              run: |
                npx supabase functions deploy email-api --no-verify-jwt --remote ${{ secrets.SUPABASE_PROJECT_REF }} --yes
              env:
                SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
